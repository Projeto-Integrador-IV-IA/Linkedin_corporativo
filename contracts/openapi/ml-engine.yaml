openapi: 3.0.3
info:
  title: ML Engine API
  version: 2.0.0
  description: Contrato entre o Match Orchestrator e o serviço Python de inferência.
paths:
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: Serviço disponível
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: UP
                  model_loaded:
                    type: boolean
                    description: Indica se o artefato job_ranker.joblib foi carregado.
                    example: true
  /predict:
    post:
      operationId: predict
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchRequest'
      responses:
        '200':
          description: Candidatos ordenados por compatibilidade
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchResponse'
        '422':
          description: Payload inválido
components:
  schemas:
    Candidate:
      type: object
      required: [candidate_id, profile_description]
      properties:
        candidate_id:
          type: string
        profile_description:
          type: string
          description: Concatenação da bio com as descrições dos projetos do portfólio.
    MatchRequest:
      type: object
      required: [candidates, project_description]
      properties:
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/Candidate'
        project_description:
          type: string
    MatchResult:
      type: object
      required: [candidate_id, score]
      properties:
        candidate_id:
          type: string
        score:
          type: number
          minimum: 0
          maximum: 100
    MatchResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/MatchResult'
