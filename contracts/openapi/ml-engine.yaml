openapi: 3.0.3
info:
  title: ML Engine API
  version: 4.0.0
  description: Contrato entre o Match Orchestrator e o serviço Python de inferência.
paths:
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: Serviço disponível
          content:
            application/json:
              schema:
                type: object
                required: [status, ready, model_loaded, semantic_model_loaded, ranking_version]
                properties:
                  status:
                    type: string
                    example: UP
                  ready:
                    type: boolean
                    description: Verdadeiro somente quando os componentes lexical e semântico estão carregados.
                    example: true
                  model_loaded:
                    type: boolean
                    description: Indica se o artefato job_ranker.joblib foi carregado.
                    example: true
                  semantic_model_loaded:
                    type: boolean
                    description: Indica se o encoder semântico multilíngue ONNX foi carregado.
                    example: true
                  ranking_version:
                    type: string
                    example: hybrid-semantic-ranker-v4
  /predict:
    post:
      operationId: predict
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchRequest'
      responses:
        '200':
          description: Candidatos ordenados por compatibilidade
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchResponse'
        '422':
          description: Payload inválido
        '503':
          description: Um dos componentes obrigatórios do ranker não está pronto
components:
  schemas:
    Candidate:
      type: object
      required: [candidate_id, profile_description]
      properties:
        candidate_id:
          type: string
        profile_description:
          type: string
          description: Concatenação da bio com as descrições dos projetos do portfólio.
    MatchRequest:
      type: object
      required: [candidates, project_description]
      properties:
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/Candidate'
        project_description:
          type: string
    MatchResult:
      type: object
      required: [candidate_id, score]
      properties:
        candidate_id:
          type: string
        score:
          type: number
          minimum: 0
          maximum: 100
          description: Índice de aderência em pontos; não é probabilidade de contratação.
    MatchResponse:
      type: object
      required: [ranking_version, results]
      properties:
        ranking_version:
          type: string
          example: hybrid-semantic-ranker-v4
        results:
          type: array
          items:
            $ref: '#/components/schemas/MatchResult'
