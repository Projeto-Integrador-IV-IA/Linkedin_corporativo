spring:
  application:
    name: match-orchestrator
  datasource:
    url: jdbc:postgresql://${MATCH_DB_HOST:match-db}:${MATCH_DB_PORT:5432}/${MATCH_DB_NAME:match_orchestrator}
    username: ${MATCH_DB_USER:match_user}
    password: ${MATCH_DB_PASSWORD:match_password}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

server:
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

services:
  profile-url: ${PROFILE_SERVICE_URL:http://profile-service:8081}
  project-url: ${PROJECT_SERVICE_URL:http://project-service:8082}
  ml-engine-url: ${ML_ENGINE_URL:http://ml-engine:8000}
