spring:
  application:
    name: project-service
  datasource:
    url: jdbc:postgresql://${PROJECT_DB_HOST:project-db}:${PROJECT_DB_PORT:5432}/${PROJECT_DB_NAME:project_service}
    username: ${PROJECT_DB_USER:project_user}
    password: ${PROJECT_DB_PASSWORD:project_password}
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    open-in-view: false
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8082}

chat:
  upload-dir: ${CHAT_UPLOAD_DIR:/app/uploads}

services:
  profile-url: ${PROFILE_SERVICE_URL:http://profile-service:8081}

llm:
  provider: ${LLM_PROVIDER:gemini}
  api-key: ${LLM_API_KEY:}
  model: ${LLM_MODEL:gemini-3.5-flash-lite}
  cooldown-hours: ${LLM_COOLDOWN_HOURS:24}
  gemini-base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
  nvidia-base-url: ${NVIDIA_BASE_URL:https://integrate.api.nvidia.com/v1}
  cost:
    input-per-million: ${LLM_INPUT_COST_PER_MILLION:0}
    output-per-million: ${LLM_OUTPUT_COST_PER_MILLION:0}

admin:
  email: ${ADMIN_EMAIL:}
  password: ${ADMIN_PASSWORD:}
  display-name: ${ADMIN_DISPLAY_NAME:Administrador}
  metrics-zone: ${ADMIN_METRICS_TIMEZONE:America/Sao_Paulo}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
