spring:
  application:
    name: profile-service
  datasource:
    url: jdbc:postgresql://${PROFILE_DB_HOST:profile-db}:${PROFILE_DB_PORT:5432}/${PROFILE_DB_NAME:profile_service}
    username: ${PROFILE_DB_USER:profile_user}
    password: ${PROFILE_DB_PASSWORD:profile_password}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
      connect-timeout: 500ms
      lettuce:
        shutdown-timeout: 100ms
  cache:
    type: redis

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
